  <line x1="50" y1="350" x2="550" y2="350" stroke="#333" stroke-width="2"/>
  
  <!-- Data Line -->
  <polyline points="50,200 100,206.9 150,234.6 200,263.0 250,290.7 300,316.7 350,345.5 400,235.1 450,266.7 500,143.7" fill="none" stroke="#2196F3" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Points -->
